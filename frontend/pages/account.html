<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - Dashboard</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="logo">Dashboard</div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html" class="active">Account</a>
          <div class="divider"></div>
          <a href="../index.html">Logout</a>
        </nav>
      </div>

      <div class="main">
        <div class="topbar">
          <h1>My Account</h1>
        </div>

        <div class="account-info">
          <h2>Profile Information</h2>
          <div class="info-item"><strong>Name:</strong> Shivang Pandey</div>
          <div class="info-item">
            <strong>Email:</strong> shivang.pandey@example.com
          </div>
        </div>

        <div class="section">
          <div class="section-header">
            <h2>Items Listed</h2>
            <button class="add-item-btn">Add Item</button>
          </div>
          <div class="item-grid">
            <div class="item-card">
              <img src="../assets/sheet container.avif" alt="Item 1" />
              <div class="item-info">
                <h4>Sheet Container</h4>
                <div class="price">₹350</div>
                <button>Edit</button>
              </div>
            </div>
            <div class="item-card">
              <img src="../assets/sheet container.avif" alt="Item 2" />
              <div class="item-info">
                <h4>Another Item</h4>
                <div class="price">₹250</div>
                <button>Edit</button>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Items Claimed</h2>
          <div class="item-grid">
            <div class="item-card">
              <img src="../assets/sheet container.avif" alt="Claimed Item 1" />
              <div class="item-info">
                <h4>Claimed Item</h4>
                <div class="price">₹500</div>
                <button>View Details</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
