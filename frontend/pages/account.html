<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - PassItOn</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body data-page="account">
    <div class="container">
      <aside class="sidebar">
        <div class="logo">PassItOn</div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html" class="active">Account</a>
          <a href="list-item.html">List Item</a>
          <a href="my-listings.html">My Listings</a>
          <a href="about.html">About Us</a>
          <div class="divider"></div>
          <a href="#" class="logout-link">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1 id="userNameHeader">My Account</h1>
        </header>

        <section class="section profile-section">
          <div class="section-header">
            <h2>Profile Information</h2>
          </div>
          <form id="profileForm" class="profile-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" required />
            </div>
            <button type="submit" class="auth-btn">Update Profile</button>
          </form>
        </section>

        <section class="section">
          <div class="section-header">
            <h2>Add New Item</h2>
          </div>
          <form id="addItemForm" class="add-item-form">
            <div class="form-group">
              <label for="itemTitle">Title</label>
              <input type="text" id="itemTitle" required />
            </div>
            <div class="form-group">
              <label for="itemDescription">Description</label>
              <textarea id="itemDescription" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label for="itemPrice">Price</label>
              <input type="number" id="itemPrice" min="0" required />
            </div>
            <div class="form-group">
              <label for="itemImage">Upload Image (optional)</label>
              <div class="file-upload">
                <label class="file-upload-button" for="itemImage"
                  >Choose file</label
                >
                <span class="file-upload-name">No file chosen</span>
                <input
                  type="file"
                  id="itemImage"
                  class="file-upload-input"
                  accept="image/*"
                />
              </div>
            </div>
            <button type="submit" class="auth-btn">Add Item</button>
          </form>
        </section>

        <section class="section">
          <div class="section-header">
            <h2>My Listings</h2>
          </div>
          <div id="myListings" class="account-item-list"></div>
        </section>

        <section class="section">
          <div class="section-header">
            <h2>Claimed Items</h2>
          </div>
          <div id="claimedListings" class="account-item-list"></div>
        </section>
      </main>
    </div>

    <script src="../js/app.js"></script>
  </body>
</html>
