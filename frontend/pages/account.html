<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - PassItOn</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body data-page="account">
    <div class="container">
      <aside class="sidebar">
        <div class="logo">PassItOn</div>
        <nav>
          <a href="dashboard.html"
            ><i class="fa-solid fa-table-columns"></i> Dashboard</a
          >
          <a href="account.html" class="active"
            ><i class="fa-solid fa-user"></i> Account</a
          >
          <a href="list-item.html"
            ><i class="fa-solid fa-plus"></i> List Item</a
          >
          <a href="my-listings.html"
            ><i class="fa-solid fa-box-open"></i> My Listings</a
          >
          <a href="about.html"
            ><i class="fa-solid fa-circle-info"></i> About Us</a
          >
          <div class="divider"></div>
          <a href="#" class="logout-link"
            ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
          >
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="userNameHeader">My Account</h1>
            <p>
              Manage your profile and keep your active listings organized in one
              polished workspace.
            </p>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" aria-label="Notifications">
              <i class="fa-solid fa-bell"></i>
            </button>
          </div>
        </header>

        <section class="section profile-section">
          <div class="profile-card">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
            <div>
              <h3 id="profileGreeting">Welcome back</h3>
            </div>
            <div class="profile-metrics">
              <div class="metric">
                <i class="fa-solid fa-box-open"></i
                ><strong id="activeCount">0</strong
                ><small>Active listings</small>
              </div>
              <div class="metric">
                <i class="fa-solid fa-handshake"></i
                ><strong id="claimedCount">0</strong
                ><small>Claimed items</small>
              </div>
            </div>
          </div>
          <form id="profileForm" class="profile-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" required />
            </div>
            <button type="submit" class="auth-btn">
              <i class="fa-solid fa-pen-to-square"></i> Update Profile
            </button>
          </form>
        </section>

        <section class="section">
          <div class="section-header">
            <h2>Add New Item</h2>
          </div>
          <form id="addItemForm" class="add-item-form">
            <div class="form-group">
              <label for="itemTitle">Title</label>
              <input type="text" id="itemTitle" required />
            </div>
            <div class="form-group">
              <label for="itemDescription">Description</label>
              <textarea id="itemDescription" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label for="itemPrice">Price</label>
              <input type="number" id="itemPrice" min="0" required />
            </div>
            <div class="form-group">
              <label for="itemImage">Upload Image (optional)</label>
              <div class="file-upload">
                <label class="file-upload-button" for="itemImage"
                  >Choose file</label
                >
                <span class="file-upload-name">No file chosen</span>
                <input
                  type="file"
                  id="itemImage"
                  class="file-upload-input"
                  accept="image/*"
                />
              </div>
            </div>
            <button type="submit" class="auth-btn">
              <i class="fa-solid fa-plus"></i> Add Item
            </button>
          </form>
        </section>

        <section class="section">
          <div class="section-header">
            <h2>My Listings</h2>
          </div>
          <div id="myListings" class="account-item-list"></div>
        </section>

        <section class="section">
          <div class="section-header">
            <h2>Claimed Items</h2>
          </div>
          <div id="claimedListings" class="account-item-list"></div>
        </section>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/account.js"></script>
