<!doctype html>
<html lang="en" ng-app="authApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - PassItOn</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  </head>
  <body ng-controller="AuthController" data-page="forgot-password">
    <div class="container">
      <aside class="sidebar">
        <h2 class="logo">PassItOn</h2>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="login.html">Login</a>
          <div class="divider"></div>
          <a href="register.html">Register</a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Reset Password</h1>
        </div>

        <div class="auth-card">
          <form name="forgotForm" ng-submit="resetPassword()" novalidate>
            <div
              class="form-group"
              ng-class="{ 'has-error': forgotForm.email.$invalid && forgotForm.email.$touched }"
            >
              <input
                type="email"
                id="email"
                name="email"
                ng-model="user.email"
                required
                placeholder=" "
              />
              <label for="email">Email</label>
              <div
                class="error-message"
                ng-show="forgotForm.email.$touched && forgotForm.email.$invalid"
              >
                <span ng-show="forgotForm.email.$error.required"
                  >Email is required</span
                >
                <span ng-show="forgotForm.email.$error.email"
                  >Enter a valid email</span
                >
              </div>
            </div>

            <div
              class="form-group"
              ng-class="{ 'has-error': forgotForm.newPassword.$invalid && forgotForm.newPassword.$touched }"
            >
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                ng-model="user.newPassword"
                required
                ng-minlength="6"
                placeholder=" "
              />
              <label for="newPassword">New Password</label>
              <div
                class="error-message"
                ng-show="forgotForm.newPassword.$touched && forgotForm.newPassword.$invalid"
              >
                <span ng-show="forgotForm.newPassword.$error.required"
                  >New password is required</span
                >
                <span ng-show="forgotForm.newPassword.$error.minlength"
                  >Password must be at least 6 characters</span
                >
              </div>
            </div>

            <button
              type="submit"
              class="auth-btn"
              ng-disabled="forgotForm.$invalid || isSaving"
            >
              Reset Password
            </button>
            <div class="error-message" ng-if="error">{{ error }}</div>
          </form>
          <div class="auth-links">
            <p>Remembered your password? <a href="login.html">Login</a></p>
            <p>Need a new account? <a href="register.html">Register here</a></p>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/validation.js"></script>
  </body>
</html>
