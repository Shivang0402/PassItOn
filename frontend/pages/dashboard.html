<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PassItOn</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <div class="container">
      <aside class="sidebar">
        <h2 class="logo">PassItOn</h2>

        <nav>
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="#">Browse Items</a>
          <a href="#">List Item</a>
          <a href="#">My Listings</a>
          <a href="account.html">Account</a>

          <div class="divider"></div>
          <a href="../index.html">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1>Campus Marketplace</h1>
          <input type="text" placeholder="Search items..." />
        </header>

        <section class="items">
          <div class="item-grid">
            <div class="item-card">
              <img src="../assets/calaculator.jpg" />
              <div class="item-info">
                <h4>FX-82MX Calculator</h4>
                <p class="seller">Shivang Pandey</p>
                <p class="price">₹350</p>
                <button>Claim</button>
              </div>
            </div>

            <div class="item-card">
              <img src="../assets/rollerscale_files/71cxTaE+KjL.jpg" />
              <div class="item-info">
                <h4>Roller Sale</h4>
                <p class="seller">By Krishna Choksi</p>
                <p class="price">₹200</p>
                <button>Claim</button>
              </div>
            </div>

            <div class="item-card">
              <img src="../assets/apron.jpg" />
              <div class="item-info">
                <h4>Apron</h4>
                <p class="seller">By Jane Smith</p>
                <p class="price">₹500</p>
                <button>Claim</button>
              </div>
            </div>

            <div class="item-card">
              <img src="../assets/sheet container.avif" />
              <div class="item-info">
                <h4>Sheet Contaienr</h4>
                <p class="price">₹250</p>
                <button>Claim</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
