<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassItOn</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body data-page="dashboard">
    <div class="container">
      <aside class="sidebar">
        <div class="logo">PassItOn</div>
        <nav>
          <a href="dashboard.html" class="active"
            ><i class="fa-solid fa-table-columns"></i> Dashboard</a
          >
          <a href="account.html"><i class="fa-solid fa-user"></i> Account</a>
          <a href="list-item.html"
            ><i class="fa-solid fa-plus"></i> List Item</a
          >
          <a href="my-listings.html"
            ><i class="fa-solid fa-box-open"></i> My Listings</a
          >
          <a href="about.html"
            ><i class="fa-solid fa-circle-info"></i> About Us</a
          >
          <div class="divider"></div>
          <a href="#" class="logout-link"
            ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
          >
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 class="user_msg">Hello, User</h1>
            <p>
              Browse available items, manage claims, and stay informed with
              smart search shortcuts.
            </p>
          </div>
          <div class="topbar-actions">
            <div class="search-wrapper">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input
                id="searchInput"
                type="text"
                placeholder="Search items..."
              />
            </div>
            <button class="icon-btn" aria-label="Notifications">
              <i class="fa-solid fa-bell"></i>
            </button>
          </div>
        </header>
        <section class="section">
          <div class="section-header">
            <h2>All Available Items</h2>
          </div>
          <div id="browseItems" class="item-grid"></div>
        </section>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
