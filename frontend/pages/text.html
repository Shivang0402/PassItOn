<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100%;
        height: 100%;
        background-color: #0f0e47;
      }
      .card {
        background-color: #8686ac;
        display: absolute;
        height: 400px;
        width: 250px;
        border-radius: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 10px;
      }
      .photo {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 240px;
        width: 240px;
        border-radius: 25px;
        margin: 5px;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 25px;
      }
      button {
        border-radius: 15px;
        padding: 5px 5px;
        width: 120px;
        background-color: #0f0e47;
        color: white;
        border: none;
        margin: 10px;
        height: 30px;
        box-shadow: 0px 4px 6px rgba(194, 181, 181, 0.1);
      }

      .info {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        width: 100%;
      }
      ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo">
        <img src="../assets/calaculator.jpg" alt="Item Photo" />
      </div>
      <div class="info">
        <div class="detals">
          <ul>
            <li>Rs.250</li>
            <li>Item Description</li>
            <li>Item Category</li>
          </ul>
        </div>
        <div class="name"><button>Reserve</button></div>
      </div>
    </div>
  </body>
</html>
