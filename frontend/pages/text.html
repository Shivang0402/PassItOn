<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100%;
        height: 100%;
        background-color: rgb(140, 210, 250);
      }
      .card {
        background-color: whitesmoke;
        border: 1px solid black;
        height: 400px;
        width: 250px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
      }
      .card img {
        margin: 10px;
        height: 200px;
        width: 80%;
        border-radius: 20px;
        display: block;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo">
        <img src="../assets/calaculator.jpg" alt="Item Photo" />
      </div>
      <div class="info">
        <div class="detals">
          <ul>
            <li>Rs.250</li>
            <li></li>
            <li></li>
          </ul>
        </div>
        <div class="name">Item Name</div>
      </div>
    </div>
  </body>
</html>
