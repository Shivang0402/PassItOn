<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #e4e1e1;
      }

      .card {
        width: 280px;
        background: #f5f5dc;
        border-radius: 30px;
        padding: 5px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .photo img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 24px;
        background-color: #c6ac8f;
      }

      .info {
        padding-top: 18px;
      }

      .item {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
        margin-bottom: 10px;
        padding: 0 10px;
      }

      .description {
        font-size: 14px;
        color: black;
        line-height: 1.4;
        margin-bottom: 20px;
        padding: 10px;
      }

      .price-button {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .price {
        font-size: 20px;
        font-weight: 500;
        color: #000000;
        padding: 10px;
      }

      button {
        width: 150px;
        background: #5e503f;
        border: none;
        padding: 8px 20px;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 550;
        margin: 10px 10px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #3b3123;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo">
        <img src="../assets/calaculator.jpg" alt="Calculator" />
      </div>

      <div class="info">
        <div class="item">Fx-82MS Scientific Calculator</div>

        <div class="description">
          A high-performance scientific calculator with advanced functions.
        </div>

        <div class="price-button">
          <div class="price">₹250</div>
          <button>Reserve</button>
        </div>
      </div>
    </div>
  </body>
</html>
