<!doctype html>
<html lang="en" ng-app="authApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PassItOn</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  </head>
  <body ng-controller="AuthController">
    <div class="container">
      <aside class="sidebar">
        <h2 class="logo">PassItOn</h2>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="register.html">Register</a>
          <div class="divider"></div>
          <a href="login.html" class="active">Login</a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Login to Your Account</h1>
        </div>

        <div class="auth-card">
          <form name="loginForm" ng-submit="login()" novalidate>
            <div class="form-group">
              <input
                type="email"
                id="email"
                name="email"
                ng-model="user.email"
                required
                placeholder=" "
              />
              <label for="email">Email</label>
              <div
                class="error-message"
                ng-show="loginForm.email.$touched && loginForm.email.$invalid"
              >
                <span ng-show="loginForm.email.$error.required"
                  >Email is required</span
                >
                <span ng-show="loginForm.email.$error.email"
                  >Please enter a valid email address</span
                >
              </div>
            </div>

            <div class="form-group">
              <input
                type="password"
                id="password"
                name="password"
                ng-model="user.password"
                ng-minlength="6"
                required
                placeholder=" "
              />
              <label for="password">Password</label>
              <div
                class="error-message"
                ng-show="loginForm.password.$touched && loginForm.password.$invalid"
              >
                <span ng-show="loginForm.password.$error.required"
                  >Password is required</span
                >
                <span ng-show="loginForm.password.$error.minlength"
                  >Password must be at least 6 characters</span
                >
              </div>
            </div>

            <button
              type="submit"
              class="auth-btn"
              ng-disabled="loginForm.$invalid"
            >
              Login
            </button>
          </form>

          <div class="auth-links">
            <p>
              Forgot your password? <a href="forgot-password.html">Reset </a>
            </p>
            <p>
              Don't have an account? <a href="register.html">Register here</a>
            </p>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/validation.js"></script>
  </body>
</html>
