<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Item - PassItOn</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body data-page="list-item">
    <div class="container">
      <aside class="sidebar">
        <div class="logo">PassItOn</div>
        <nav>
          <a href="dashboard.html"
            ><i class="fa-solid fa-table-columns"></i> Dashboard</a
          >
          <a href="account.html"><i class="fa-solid fa-user"></i> Account</a>
          <a href="list-item.html" class="active"
            ><i class="fa-solid fa-plus"></i> List Item</a
          >
          <a href="my-listings.html"
            ><i class="fa-solid fa-box-open"></i> My Listings</a
          >
          <a href="about.html"
            ><i class="fa-solid fa-circle-info"></i> About Us</a
          >
          <div class="divider"></div>
          <a href="#" class="logout-link"
            ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
          >
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>List an Item</h1>
            <p>
              Use the form below to create a new listing. Provide clear details
              and a good photo to help others understand what you're offering.
            </p>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" aria-label="Notifications">
              <i class="fa-solid fa-bell"></i>
            </button>
          </div>
        </header>

        <section class="section">
          <div class="section-header">
            <h2>New Listing</h2>
          </div>
          <form id="addItemForm" class="add-item-form">
            <div class="form-group">
              <label for="itemTitle">Item Name</label>
              <input type="text" id="itemTitle" required />
            </div>
            <div class="form-group">
              <label for="itemDescription">Description</label>
              <textarea id="itemDescription" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label for="itemPrice">Price</label>
              <input type="number" id="itemPrice" min="0" required />
            </div>
            <div class="form-group">
              <label for="itemImage">Upload Image</label>
              <div class="file-upload">
                <label class="file-upload-button" for="itemImage"
                  >Choose file</label
                >
                <span class="file-upload-name">No file chosen</span>
                <input
                  type="file"
                  id="itemImage"
                  class="file-upload-input"
                  accept="image/*"
                />
              </div>
            </div>
            <button type="submit" class="auth-btn">
              <i class="fa-solid fa-plus"></i> Create Listing
            </button>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/list-item.js"></script>
