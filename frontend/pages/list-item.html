<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Item - PassItOn</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body data-page="list-item">
    <div class="container">
      <aside class="sidebar">
        <div class="logo">PassItOn</div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html">Account</a>
          <a href="list-item.html" class="active">List Item</a>
          <a href="my-listings.html">My Listings</a>
          <a href="about.html">About Us</a>
          <div class="divider"></div>
          <a href="#" class="logout-link">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1>List an Item</h1>
          <p>
            Use the form below to create a new listing. Provide clear details
            and a good photo to help others understand what you're offering.
          </p>
        </header>

        <section class="section">
          <div class="section-header">
            <h2>New Listing</h2>
          </div>
          <form id="addItemForm" class="add-item-form">
            <div class="form-group">
              <label for="itemTitle">Item Name</label>
              <input type="text" id="itemTitle" required />
            </div>
            <div class="form-group">
              <label for="itemDescription">Description</label>
              <textarea id="itemDescription" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label for="itemPrice">Price</label>
              <input type="number" id="itemPrice" min="0" required />
            </div>
            <div class="form-group">
              <label for="itemImage">Upload Image</label>
              <div class="file-upload">
                <label class="file-upload-button" for="itemImage"
                  >Choose file</label
                >
                <span class="file-upload-name">No file chosen</span>
                <input
                  type="file"
                  id="itemImage"
                  class="file-upload-input"
                  accept="image/*"
                />
              </div>
            </div>
            <button type="submit" class="auth-btn">Create Listing</button>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/app.js"></script>
  </body>
</html>
